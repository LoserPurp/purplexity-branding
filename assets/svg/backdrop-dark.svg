<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Purplexity backdrop (dark)</title>
  <!-- dark theme: near-black base with a hint of purple, same glow and stars as the light backdrop -->
  <defs>
    <!-- true 45° gradient through the centre: dark purple bottom-left fading into black top-right -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="210" y1="1290" x2="1710" y2="-210">
      <stop offset="0.000" stop-color="#2B1343"/>
      <stop offset="0.167" stop-color="#221036"/>
      <stop offset="0.333" stop-color="#1A0C2A"/>
      <stop offset="0.500" stop-color="#130920"/>
      <stop offset="0.667" stop-color="#0E0718"/>
      <stop offset="0.833" stop-color="#0A0612"/>
      <stop offset="1.000" stop-color="#07050D"/>
    </linearGradient>

    <!-- long, soft blue glow creeping in from every edge (gradients, no blur, so it stays band-free) -->
    <linearGradient id="glowFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#41B8E4" stop-opacity="0.18"/>
      <stop offset="0.12" stop-color="#41B8E4" stop-opacity="0.13"/>
      <stop offset="0.3"  stop-color="#41B8E4" stop-opacity="0.075"/>
      <stop offset="0.55" stop-color="#41B8E4" stop-opacity="0.03"/>
      <stop offset="0.8"  stop-color="#41B8E4" stop-opacity="0.008"/>
      <stop offset="1"    stop-color="#41B8E4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <g fill="url(#glowFade)">
    <rect width="380" height="1080"/>
    <rect width="380" height="1080" transform="translate(1920 0) scale(-1 1)"/>
    <rect width="380" height="1920" transform="translate(1920 0) rotate(90)"/>
    <rect width="380" height="1920" transform="translate(0 1080) rotate(-90)"/>
  </g>

