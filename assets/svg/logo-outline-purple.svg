<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Purplexity">
  <title>Purplexity</title>
  <!-- Main logo, purple version: outline logo filled with the tile gradient -->
  <defs>
    <!-- 45°: Tile Bright bottom-left to Tile Deep top-right -->
    <linearGradient id="fill" gradientUnits="userSpaceOnUse" x1="22" y1="490" x2="490" y2="22">
      <stop offset="0.000" stop-color="#9E12DA"/>
      <stop offset="0.167" stop-color="#9412D3"/>
      <stop offset="0.333" stop-color="#8412C9"/>
      <stop offset="0.500" stop-color="#7112BC"/>
      <stop offset="0.667" stop-color="#5E13B0"/>
      <stop offset="0.833" stop-color="#4E13A6"/>
      <stop offset="1.000" stop-color="#44139F"/>
    </linearGradient>
  </defs>

  <!-- background inside the border, then the border on top -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="url(#fill)"/>
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="#F4EEFB" stroke-width="22"/>

  <!-- double arc -->
  <g fill="none" stroke-linecap="round" transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <path d="M382.86 302.17 A135 135 0 1 1 209.83 129.14" stroke="#F4EEFB" stroke-width="42"/>
    <path d="M190.22 232.06 A70 70 0 1 1 279.94 321.78" stroke="#7FD3F0" stroke-width="33"/>
  </g>
</svg>
