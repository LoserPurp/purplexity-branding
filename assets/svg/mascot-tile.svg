<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Purplexity octopus">
  <title>Purplexity octopus</title>
  <!-- all colours are 20% less saturated than the originals -->
  <defs>
    <!-- 45° background: bright purple bottom-left to deep purple top-right -->
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0.000" stop-color="#9626C6"/>
      <stop offset="0.167" stop-color="#8D25C0"/>
      <stop offset="0.333" stop-color="#8024B7"/>
      <stop offset="0.500" stop-color="#6F23AB"/>
      <stop offset="0.667" stop-color="#5F23A0"/>
      <stop offset="0.833" stop-color="#512297"/>
      <stop offset="1.000" stop-color="#482191"/>
    </linearGradient>

    <!-- wide blur so the blue glow reaches well into the tile -->
    <filter id="glowBlur" filterUnits="userSpaceOnUse" x="-160" y="-160" width="832" height="832">
      <feGaussianBlur stdDeviation="38"/>
    </filter>

    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="33.6" y1="100.1" x2="478.4" y2="421.9">
      <stop offset="0" stop-color="#B693DF"/>
      <stop offset="1" stop-color="#845DB9"/>
    </linearGradient>

    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" rx="116" fill="none" stroke="#41B8E4" stroke-width="90" stroke-opacity="0.22" filter="url(#glowBlur)"/>

    <!-- stars: tiny, faint, translucent -->
    <g fill="#FFFFFF">
      <circle cx="58"  cy="70"  r="1.2" fill-opacity="0.30"/>
      <circle cx="104" cy="42"  r="0.8" fill-opacity="0.22"/>
      <circle cx="150" cy="88"  r="1.6" fill-opacity="0.18"/>
      <circle cx="196" cy="34"  r="1.0" fill-opacity="0.34"/>
      <circle cx="238" cy="72"  r="0.8" fill-opacity="0.25"/>
      <circle cx="286" cy="28"  r="1.4" fill-opacity="0.20"/>
      <circle cx="330" cy="64"  r="1.0" fill-opacity="0.32"/>
      <circle cx="372" cy="40"  r="1.8" fill-opacity="0.16"/>
      <circle cx="418" cy="82"  r="0.9" fill-opacity="0.28"/>
      <circle cx="462" cy="52"  r="1.2" fill-opacity="0.22"/>
      <circle cx="270" cy="108" r="1.1" fill-opacity="0.18"/>
      <circle cx="120" cy="118" r="0.8" fill-opacity="0.26"/>
      <circle cx="400" cy="120" r="1.3" fill-opacity="0.20"/>
      <circle cx="44"  cy="150" r="1.5" fill-opacity="0.20"/>
      <circle cx="92"  cy="176" r="0.9" fill-opacity="0.30"/>
      <circle cx="130" cy="214" r="1.2" fill-opacity="0.16"/>
      <circle cx="66"  cy="232" r="0.8" fill-opacity="0.26"/>
      <circle cx="452" cy="160" r="1.0" fill-opacity="0.30"/>
      <circle cx="410" cy="196" r="1.6" fill-opacity="0.18"/>
      <circle cx="384" cy="236" r="0.8" fill-opacity="0.28"/>
      <circle cx="476" cy="226" r="1.2" fill-opacity="0.20"/>
      <circle cx="36"  cy="300" r="1.0" fill-opacity="0.22"/>
      <circle cx="58"  cy="356" r="1.6" fill-opacity="0.16"/>
      <circle cx="30"  cy="410" r="0.8" fill-opacity="0.30"/>
      <circle cx="478" cy="300" r="0.9" fill-opacity="0.26"/>
      <circle cx="456" cy="352" r="1.4" fill-opacity="0.18"/>
      <circle cx="486" cy="404" r="1.0" fill-opacity="0.24"/>
      <circle cx="88"  cy="440" r="1.2" fill-opacity="0.22"/>
      <circle cx="132" cy="470" r="0.8" fill-opacity="0.30"/>
      <circle cx="176" cy="428" r="1.5" fill-opacity="0.16"/>
      <circle cx="222" cy="462" r="1.0" fill-opacity="0.28"/>
      <circle cx="264" cy="420" r="0.8" fill-opacity="0.20"/>
      <circle cx="304" cy="476" r="1.3" fill-opacity="0.20"/>
      <circle cx="348" cy="436" r="0.9" fill-opacity="0.30"/>
      <circle cx="392" cy="468" r="1.6" fill-opacity="0.16"/>
      <circle cx="430" cy="430" r="1.0" fill-opacity="0.26"/>
      <circle cx="160" cy="492" r="1.1" fill-opacity="0.18"/>
      <circle cx="18"  cy="250" r="1.0" fill-opacity="0.20"/>
      <circle cx="494" cy="130" r="0.8" fill-opacity="0.24"/>
      <circle cx="340" cy="12"  r="1.0" fill-opacity="0.20"/>
    </g>

    <!-- octopus, scaled down to sit inside the tile -->
    <g transform="translate(256 262) scale(0.78) translate(-256 -261)">
      <path fill="url(#body)" stroke="#3D2569" stroke-width="10" stroke-linejoin="round"
            d="M256 92
               C184 92 132 140 132 214
               C132 238 122.5 254 103.3 259.3
               C76.8 266.6 29 310 34 333
               C38.9 354.9 60.9 364.3 81.9 357.4
               C94 353.4 93.2 352.7 91.4 365.4
               C88.5 385.9 98.9 404.4 119 410
               C140.3 416.3 158.5 404.5 166.7 386.5
               C172 374.8 169.9 374.4 172.1 387
               C176.4 412.6 193.1 430 214 430
               C234 430 246.3 414.6 252.5 394.7
               C256.3 382.4 255.7 382.4 259.5 394.7
               C265.7 414.6 278 430 298 430
               C318.9 430 335.6 412.6 339.9 387
               C342.1 374.4 340 374.8 345.3 386.5
               C353.5 404.5 371.7 416.3 393 410
               C413.1 404.4 423.5 385.9 420.6 365.4
               C418.8 352.7 418 353.4 430.1 357.4
               C451.1 364.3 473.1 354.9 478 333
               C483 310 435.2 266.6 408.7 259.3
               C389.5 254 380 238 380 214
               C380 140 328 92 256 92 Z"/>

      <!-- eyes -->
      <g fill="#221634">
        <ellipse cx="205" cy="224" rx="25" ry="32"/>
        <ellipse cx="307" cy="224" rx="25" ry="32"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="198" cy="214" r="8"/>
        <circle cx="300" cy="214" r="8"/>
        <circle cx="211" cy="237" r="4"/>
        <circle cx="313" cy="237" r="4"/>
      </g>

      <!-- smile -->
      <path d="M239 258 C247 271 265 271 273 258" fill="none" stroke="#221634" stroke-width="8" stroke-linecap="round"/>

      <!-- shine on the head -->
      <path d="M167.8 148.7 C181 127.8 201.1 117.1 222.2 111.3" fill="none" stroke="#EADFF8" stroke-width="14" stroke-linecap="round"/>
      <circle cx="158" cy="162" r="7" fill="#EADFF8"/>
    </g>
  </g>
</svg>
