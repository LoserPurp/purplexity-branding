<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Purplexity">
  <title>Purplexity (black with blue)</title>
  <!-- Main logo, black with blue: border and outer arc black, inner arc Arc Blue, for light backgrounds -->

  <!-- border -->
  <rect x="22" y="22" width="468" height="468" rx="106" fill="none" stroke="#000000" stroke-width="22"/>

  <!-- double arc, scaled down to sit inside the border -->
  <g fill="none" stroke-linecap="round" transform="translate(256 256) scale(0.9) translate(-256 -256)">
    <path d="M382.86 302.17 A135 135 0 1 1 209.83 129.14" stroke="#000000" stroke-width="42"/>
    <!-- inner arc a touch thinner, like the p in the wordmark -->
    <path d="M190.22 232.06 A70 70 0 1 1 279.94 321.78" stroke="#7FD3F0" stroke-width="33"/>
  </g>
</svg>
